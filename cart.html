<!DOCTYPE html>
<html>
<head>
    <title>Cart | Sweet Crumbs Bakery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart.css">
</head>

<body>
    <header>
        <h1>Sweet Crumbs</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="cart.html">Cart</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="cart-page">
        <section class="cart-header">
            <h2>Your Cart</h2>
            <p>Fresh picks ready for checkout.</p>
        </section>

        <section class="cart-items">
            <div class="cart-item">
                <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=900&q=80" alt="Chocolate cake">
                <div>
                    <h3>Chocolate Cake</h3>
                    <p>1 item</p>
                </div>
                <span>₹499</span>
            </div>

            <div class="cart-item">
                <img src="https://images.unsplash.com/photo-1486427944299-d1955d23e34d?auto=format&fit=crop&w=900&q=80" alt="Vanilla cupcakes">
                <div>
                    <h3>Vanilla Cupcakes</h3>
                    <p>2 items</p>
                </div>
                <span>₹240</span>
            </div>
        </section>

        <section class="checkout-box">
            <h3>Order Summary</h3>
            <div class="summary-row"><span>Subtotal</span><span>₹739</span></div>
            <div class="summary-row"><span>Delivery</span><span>₹60</span></div>
            <div class="summary-row total"><span>Total</span><span>₹799</span></div>
            <button>Proceed to Checkout</button>
        </section>
    </main>

    <footer>
        <p>© 2026 Sweet Crumbs Bakery | Online Bakery Ordering System</p>
    </footer>
</body>
</html>
